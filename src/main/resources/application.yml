spring:
  application:
    name: banking-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/banking}
    username: ${DB_USER:banking}
    password: ${DB_PASSWORD:banking}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # el esquema lo gestiona Flyway (ver db/migration)
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

banking:
  timezone: America/Bogota

springdoc:
  swagger-ui:
    path: /swagger-ui.html
