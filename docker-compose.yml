services:
  db:
    image: postgres:16-alpine
    container_name: banking-db
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
    ports:
      - "5433:5432"
    volumes:
      - banking-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: banking-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/banking
      DB_USER: banking
      DB_PASSWORD: banking
    ports:
      - "8080:8080"

volumes:
  banking-data:
